global:
  # Intervalle court volontairement : les courbes du dashboard bougent en
  # quelques secondes quand on genere du trafic.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # L'application est scrapee a travers nginx : en blue/green une seule
  # couleur tourne a la fois, nginx est donc la seule cible stable.
  #
  # `nginx` est le NOM DU SERVICE compose. Depuis l'interieur du conteneur
  # Prometheus, `localhost` designerait Prometheus lui-meme, pas l'appli :
  # c'est la confusion la plus frequente entre l'adresse vue depuis l'hote
  # et celle vue depuis le conteneur.
  - job_name: flask-app
    metrics_path: /metrics
    static_configs:
      - targets: ["nginx:80"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
