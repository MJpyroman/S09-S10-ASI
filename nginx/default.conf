server {
    listen 80;
    server_name _;

    # Resolveur DNS interne de Docker. Indispensable : avec un upstream
    # passe en variable, nginx resout le nom a chaque requete et non au
    # demarrage. Sans ca, nginx refuserait de demarrer tant que la couleur
    # ciblee n'est pas lancee.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
    }

    location / {
        # Valeur par defaut, utilisee tant qu'aucune bascule n'a eu lieu.
        set $active_app "app-blue";

        # Reecrit par deploy.sh, puis pris en compte par `nginx -s reload`.
        # Le glob tolere l'absence de fichier (environnement neuf).
        include /etc/nginx/active/*.conf;

        proxy_pass http://$active_app:5000$request_uri;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }
}
